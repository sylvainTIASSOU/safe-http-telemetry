name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo test --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - run: cargo check --locked --all-targets --all-features
      - run: cargo test --locked --all-targets --all-features


  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Run semver-checks
        run: cargo semver-checks check-release

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run --locked --all-features
      - run: cargo package --locked --no-verify
      - name: Enforce package size and database exclusions
        run: |
          python3 - <<'PYCODE'
          import pathlib, tarfile
          archive = next(pathlib.Path("target/package").glob("safe-http-telemetry-*.crate"))
          assert archive.stat().st_size < 10_000_000, "crate exceeds the registry size limit"
          with tarfile.open(archive) as package:
              files = package.getnames()
          assert not any("/data/" in name for name in files), "production data included"
          assert any(name.endswith("tests/fixtures/GeoIP2-City-Test.mmdb") for name in files)
          PYCODE
