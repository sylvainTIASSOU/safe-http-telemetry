[package]
name = "safe-http-telemetry"
version = "0.1.0-dev.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Safe, bounded HTTP telemetry for Axum, tracing, Log Observability, OpenTelemetry and Grafana Loki"
readme = "README.md"
keywords = ["axum", "telemetry", "opentelemetry", "loki", "tracing"]
categories = [
    "development-tools::debugging",
    "web-programming::http-server",
    "network-programming::protocols::http",
]
publish = false

[features]
default = []
axum = ["tower", "dep:axum"]
tower = [
    "dep:http",
    "dep:http-body",
    "dep:ipnet",
    "dep:form_urlencoded",
    "dep:pin-project-lite",
    "dep:tower",
    "dep:tracing",
]
tracing = ["dep:tracing", "dep:tracing-subscriber"]
opentelemetry = [
    "tracing",
    "dep:http",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]
body-capture = [
  "dep:bytes",
    "dep:http-body-util",
    "dep:form_urlencoded",
]
geolocation = ["dep:maxminddb"]
loki = ["dep:url", "dep:reqwest", "dep:tokio"]


[dependencies]
async-channel = "=2.3.1"
axum = { version = "=0.8.9", optional = true }
http = { version = "=1.5.0", optional = true }
http-body = { version = "=1.1.0", optional = true }
pin-project-lite = { version = "=0.2.17", optional = true }
http-body-util = { version = "0.1", optional = true }
form_urlencoded = { version = "=1.2.2", optional = true }
ipnet = { version = "=2.12.2", optional = true }
maxminddb = { version = "=0.32.0", optional = true }
bytes = { version = "=1.12.1", optional = true }

opentelemetry = { version = "=0.33.1",default-features = false,features = ["trace"],optional = true}

opentelemetry_sdk = {version = "=0.33.0",default-features = false,features = ["trace"],optional = true}

reqwest = { version = "=0.12.15", default-features = false, features = ["rustls-tls"], optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tower = { version = "=0.5.2", features = ["timeout"], optional = true }

tokio = { version = "=1.44.2", default-features = false, features = ["rt", "time"], optional = true }

tracing = {version = "0.1",optional = true}

tracing-opentelemetry = {version = "=0.34.0",default-features = false,optional = true}

tracing-subscriber = { version = "=0.3.22", default-features = false, features = ["registry", "std", "fmt"], optional = true }

url = { version = "2.5", optional = true }
writeable = { version = "0.6.4", features = ["alloc"] }


[dev-dependencies]
tokio = { version = "=1.44.2", default-features = false, features = ["io-util", "macros", "net", "signal", "rt-multi-thread", "sync", "time"] }
tower = { version = "=0.5.2", features = ["util"] }
bytes = "=1.12.1"
futures-util = "=0.3.34"
http-body-util = "=0.1.5"


[[example]]
name = "minimal_axum"
path = "examples/minimal_axum.rs"
required-features = ["axum", "tracing"]

[[example]]
name = "axum_loki"
path = "examples/axum_loki.rs"
required-features = ["axum", "loki", "tracing", "opentelemetry"]

[[test]]
name = "loki_http_e2e"
path = "tests/loki_http_e2e.rs"
required-features = ["axum", "loki"]
