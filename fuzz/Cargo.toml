[package]
name = "safe-http-telemetry-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
# Depend on the main crate to fuzz its public functions.
# Adjust the package name and features to match the main Cargo.toml when needed.
safe-http-telemetry = { path = "..", features = ["axum", "body-capture"] }

# Fuzz targets.
[[bin]]
name = "fuzz_query"
path = "fuzz_targets/fuzz_query.rs"
test = false
doc = false

[[bin]]
name = "fuzz_headers"
path = "fuzz_targets/fuzz_headers.rs"
test = false
doc = false

[[bin]]
name = "fuzz_json_redaction"
path = "fuzz_targets/fuzz_json_redaction.rs"
test = false
doc = false
